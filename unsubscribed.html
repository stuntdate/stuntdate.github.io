  .steps span{font-family:var(--display);font-size:40px;line-height:1;color:var(--red);min-width:26px;text-align:center}
  .steps div{font-size:16px;line-height:1.5;color:#F5EEDC}
  .steps b{color:#F5EEDC}
  .ideas{list-style:none;display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid #F5EEDC}
  .ideas li{padding:14px 0 14px 28px;border-bottom:1px solid #F5EEDC;position:relative;font-size:16px;line-height:1.5;color:#F5EEDC}

  .perks{list-style:none;display:flex;flex-direction:column;gap:14px}
  .perks li{font-size:16px;line-height:1.6;color:#F5EEDC}
  .perks b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:#F5EEDC;letter-spacing:.2px}
  blockquote{margin-top:28px;border-left:6px solid var(--red);padding:6px 0 6px 18px;font-family:var(--display);font-size:30px;line-height:1.15;color:#F5EEDC}
  .cta{display:block;margin-top:44px;background:var(--red);color:#F5EEDC;text-decoration:none;text-align:center;font-family:var(--display);font-size:32px;padding:26px 10px}

  .cta small{display:block;font-family:var(--mono);font-size:14px;margin-top:6px;letter-spacing:.3px;opacity:.9}
  .more{margin-top:40px;display:flex;flex-direction:column;gap:10px}
  .more a{display:block;border:3px solid #F5EEDC;padding:16px;text-decoration:none;font-family:var(--display);font-size:20px}
  .more a:hover{background:#F5EEDC;color:#000}
  footer{margin-top:44px;color:#F5EEDC;font-size:15px;text-align:center}
  footer a{color:inherit;text-decoration:none}
  body{font-weight:700}h1,h2,.home,.cta,.more a,.steps span{font-weight:400}

name: Keep Supabase awake
# Free Supabase projects pause after ~7 days of low activity, which breaks signups.
# This makes one tiny read-only request every day so the database stays on.
on:
  schedule:
    - cron: "17 16 * * *"   # daily, ~9am Los Angeles
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://uteudsgyzjbqqupprvbh.supabase.co/rest/v1/beta_signups?select=id&limit=1" \
            -H "apikey: sb_publishable_67qWv22s-hW7gmldtJUCNg_Negs__jA")
          echo "Supabase answered $code"
          test "$code" = "200"
